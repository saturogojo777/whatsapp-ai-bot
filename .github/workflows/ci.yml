name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify static assets resolve
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            const refs = [...html.matchAll(/(?:href|src)=\"(\.[^\"]+)\"/g)].map((m) => m[1]);
            const missing = refs.filter((ref) => !fs.existsSync(ref.replace(/^\\.\\//, '')));
            if (missing.length) {
              console.error('Missing assets:', missing);
              process.exit(1);
            }
            console.log('All', refs.length, 'local asset references resolve.');
          "
