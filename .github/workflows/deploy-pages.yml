name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The site is static: everything except dev tooling is published as-is.
      - name: Prepare artifact
        run: |
          mkdir -p dist
          rsync -a --exclude='.git' \
                   --exclude='node_modules' \
                   --exclude='tests' \
                   --exclude='playground' \
                   --exclude='scripts' \
                   --exclude='.github' \
                   --exclude='package*.json' \
                   --exclude='docs' \
                   ./ dist/
          test -f dist/index.html
          echo "Publishing $(find dist -type f | wc -l) files, $(du -sh dist | cut -f1)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
